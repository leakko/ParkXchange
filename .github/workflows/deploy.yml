name: deploy

# Deploys the API to the Hetzner VPS after a push to main.
# Bootstrap (empty VPS + DNS + Actions secrets) is one-time; every later
# push updates the server without hand-editing .env on the box.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build, push, restart VPS
    runs-on: ubuntu-24.04
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5

      # GHCR rejects uppercase; github.repository is leakko/ParkXchange.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          POSTGRES_USER: ${{ secrets.DEPLOY_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DEPLOY_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DEPLOY_POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.DEPLOY_JWT_SECRET }}
          LOCATION_FUZZ_SECRET: ${{ secrets.DEPLOY_LOCATION_FUZZ_SECRET }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          CLONE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOMAIN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,LOCATION_FUZZ_SECRET,API_IMAGE,CLONE_URL,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            APP_DIR=/opt/parkxchange

            if ! command -v docker >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y docker.io docker-compose-v2 git curl
              systemctl enable --now docker
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$CLONE_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git remote set-url origin "$CLONE_URL"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$APP_DIR"
            umask 077
            printf '%s\n' \
              "DOMAIN=${DOMAIN}" \
              "API_IMAGE=${API_IMAGE}" \
              "POSTGRES_USER=${POSTGRES_USER}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "POSTGRES_DB=${POSTGRES_DB:-parkxchange}" \
              "API_ENV=production" \
              "LOG_LEVEL=info" \
              "JWT_SECRET=${JWT_SECRET}" \
              "LOCATION_FUZZ_SECRET=${LOCATION_FUZZ_SECRET}" \
              "CORS_ALLOWED_ORIGINS=*" \
              "ACCESS_TOKEN_TTL=15m" \
              "REFRESH_TOKEN_TTL=720h" \
              "SWEEP_INTERVAL=15s" \
              > deploy/hetzner/.env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f deploy/hetzner/docker-compose.yml --env-file deploy/hetzner/.env pull api
            docker compose -f deploy/hetzner/docker-compose.yml --env-file deploy/hetzner/.env up -d
            docker image prune -f
