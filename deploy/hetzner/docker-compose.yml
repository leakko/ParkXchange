# Production stack for a single Hetzner VPS.
#
# Local/manual:
#   docker compose -f deploy/hetzner/docker-compose.yml --env-file deploy/hetzner/.env up -d --build
#
# GitHub Actions builds the API image, pushes it to GHCR, SSHs here and runs:
#   docker compose pull api && docker compose up -d
#
# Postgres is not published to the host. Only Caddy listens on 80/443.

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: parkxchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    # Set API_IMAGE in .env (Actions writes it). Fallback builds from the repo.
    image: ${API_IMAGE:-parkxchange-api:prod}
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    container_name: parkxchange-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      API_ENV: ${API_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      LOCATION_FUZZ_SECRET: ${LOCATION_FUZZ_SECRET}
      # Required outside development; "*" is fine for a mobile-first family beta
      # (native clients are not subject to CORS; it also unlocks WS origins).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-15s}
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    container_name: parkxchange-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
