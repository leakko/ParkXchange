openapi: 3.1.0
info:
  title: ParkXchange API
  version: 0.1.0
  description: |
    HTTP and WebSocket surface of the ParkXchange parking marketplace.
    This document is the source of truth for request and response types.
    Handlers stay handwritten on net/http; only these types are generated.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: health
  - name: auth
  - name: vehicles
  - name: spots
  - name: offers
  - name: reservations
  - name: realtime

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process can serve HTTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /v1/version:
    get:
      tags: [health]
      operationId: getVersion
      summary: Build identity of this binary
      security: []
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Error"

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update the caller's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/me/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change password and revoke all refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; existing refresh tokens revoked
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: The caller's vehicles (metadata only; no photo bytes)
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Register a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleID"
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: One of the caller's vehicles
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Replace mutable vehicle fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      tags: [vehicles]
      operationId: deleteVehicle
      summary: Delete a vehicle and its photo
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/vehicles/{id}/photo:
    parameters:
      - $ref: "#/components/parameters/VehicleID"
    put:
      tags: [vehicles]
      operationId: putVehiclePhoto
      summary: Upload a JPEG or PNG photo (max 300 KiB)
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Photo stored
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      tags: [vehicles]
      operationId: getVehiclePhoto
      summary: Download the vehicle photo (owner only)
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/spots:
    get:
      tags: [spots]
      operationId: listSpots
      summary: Spots visible in a viewport, as GeoJSON
      security: []
      parameters:
        - $ref: "#/components/parameters/BBox"
        - $ref: "#/components/parameters/Zoom"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: FeatureCollection of spots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotFeatureCollection"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [spots]
      operationId: createSpot
      summary: Announce a parking spot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpotRequest"
      responses:
        "201":
          description: Created offer as a GeoJSON feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotFeature"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/spots/mine:
    get:
      tags: [spots]
      operationId: listMySpots
      summary: The caller's own offers
      responses:
        "200":
          description: FeatureCollection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotFeatureCollection"
        "401":
          $ref: "#/components/responses/Error"

  /v1/spots/{id}:
    parameters:
      - $ref: "#/components/parameters/SpotID"
    get:
      tags: [spots]
      operationId: getSpot
      summary: One spot as a GeoJSON feature
      security: []
      responses:
        "200":
          description: Feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotFeature"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [spots]
      operationId: updateSpot
      summary: Edit an available offer (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpotRequest"
      responses:
        "200":
          description: Updated offer as a GeoJSON feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotFeature"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      tags: [spots]
      operationId: deleteSpot
      summary: Withdraw an offer
      responses:
        "204":
          description: Withdrawn
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/spots/{id}/vehicle/photo:
    get:
      tags: [spots]
      operationId: getSpotVehiclePhoto
      summary: Photo of the vehicle linked to a spot
      parameters:
        - $ref: "#/components/parameters/SpotID"
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/spots/{id}/offers:
    post:
      tags: [offers]
      operationId: createOffer
      summary: Propose a dated exchange for a listing
      parameters:
        - $ref: "#/components/parameters/SpotID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferRequest"
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      tags: [offers]
      operationId: listSpotOffers
      summary: List offers for a listing owned by the caller
      parameters:
        - $ref: "#/components/parameters/SpotID"
      responses:
        "200":
          description: Offers ordered by preferred-time match, then amount
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/offers/{id}/accept:
    post:
      tags: [offers]
      operationId: acceptOffer
      summary: Accept an offer and atomically create its reservation
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/offers/{id}/reject:
    post:
      tags: [offers]
      operationId: rejectOffer
      summary: Reject a pending offer as listing owner
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "204":
          description: Rejected
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/offers/{id}/withdraw:
    post:
      tags: [offers]
      operationId: withdrawOffer
      summary: Withdraw a pending offer as its driver
      parameters:
        - $ref: "#/components/parameters/OfferID"
      responses:
        "204":
          description: Withdrawn
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/reservations/active:
    get:
      tags: [reservations]
      operationId: listActiveReservations
      summary: The caller's active reservations
      responses:
        "200":
          description: Active reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationResponse"
        "401":
          $ref: "#/components/responses/Error"

  /v1/reservations/{id}:
    get:
      tags: [reservations]
      operationId: getReservation
      summary: One reservation
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/reservations/{id}/owner-ready:
    post:
      tags: [reservations]
      operationId: markOwnerReady
      summary: Mark the listing owner ready to leave
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      responses:
        "204":
          description: Owner ready recorded
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/reservations/{id}/driver-arrived:
    post:
      tags: [reservations]
      operationId: markDriverArrived
      summary: Record the driver's early “I arrived” signal
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      responses:
        "204":
          description: Driver arrival recorded
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/reservations/{id}/driver-ready:
    post:
      tags: [reservations]
      operationId: markDriverReady
      summary: Complete the handover once the owner is ready
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      responses:
        "204":
          description: Handover completed
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/reservations/{id}/cancel:
    post:
      tags: [reservations]
      operationId: cancelReservation
      summary: Cancel a reservation
      parameters:
        - $ref: "#/components/parameters/ReservationID"
      responses:
        "204":
          description: Cancelled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/ws/tickets:
    post:
      tags: [realtime]
      operationId: issueSocketTicket
      summary: Short-lived ticket for the WebSocket handshake
      responses:
        "201":
          description: Ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "401":
          $ref: "#/components/responses/Error"

  /v1/ws:
    get:
      tags: [realtime]
      operationId: openWebSocket
      summary: Viewport-subscribed event stream
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
          description: Ticket from POST /v1/ws/tickets; not an access token
      responses:
        "101":
          description: Protocol switched to WebSocket
        "401":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SpotID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BBox:
      name: bbox
      in: query
      required: true
      description: minLon,minLat,maxLon,maxLat
      schema:
        type: string
        example: "2.15,41.38,2.18,41.40"
    Zoom:
      name: zoom
      in: query
      required: false
      schema:
        type: integer
    From:
      name: from
      in: query
      required: false
      description: Inclusive start of the time window (RFC3339)
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive end of the time window (RFC3339)
      schema:
        type: string
        format: date-time

  responses:
    Error:
      description: Uniform error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
        database:
          type: string

    VersionResponse:
      type: object
      required: [version, revision, build_time, go_version]
      properties:
        version:
          type: string
        revision:
          type: string
        build_time:
          type: string
        go_version:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          minLength: 2
          maxLength: 60

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    SessionResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds remaining on the access token
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      required: [id, email, display_name, rating_count, balance_cents]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        rating:
          type: number
          format: double
          nullable: true
        rating_count:
          type: integer
        balance_cents:
          type: integer
          format: int64

    UpdateMeRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 60

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 256

    VehicleResponse:
      type: object
      required:
        - id
        - plate
        - make_model
        - size_class
        - color
        - year
        - has_photo
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        plate:
          type: string
        make_model:
          type: string
        size_class:
          type: string
          enum: [small, medium, large]
        color:
          type: string
        year:
          type: integer
        has_photo:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVehicleRequest:
      type: object
      required: [plate, make_model, size_class, color, year]
      properties:
        plate:
          type: string
          minLength: 1
          maxLength: 16
        make_model:
          type: string
          minLength: 1
          maxLength: 80
        size_class:
          type: string
          enum: [small, medium, large]
        color:
          type: string
          minLength: 1
          maxLength: 40
        year:
          type: integer
          minimum: 1980

    UpdateVehicleRequest:
      type: object
      required: [plate, make_model, size_class, color, year]
      properties:
        plate:
          type: string
          minLength: 1
          maxLength: 16
        make_model:
          type: string
          minLength: 1
          maxLength: 80
        size_class:
          type: string
          enum: [small, medium, large]
        color:
          type: string
          minLength: 1
          maxLength: 40
        year:
          type: integer
          minimum: 1980

    VehicleSummary:
      type: object
      required: [id, plate, make_model, color, year, size_class, has_photo]
      description: Claimer-visible car identity embedded on spot features
      properties:
        id:
          type: string
          format: uuid
        plate:
          type: string
        make_model:
          type: string
        color:
          type: string
        year:
          type: integer
        size_class:
          type: string
          enum: [small, medium, large]
        has_photo:
          type: boolean

    CreateSpotRequest:
      type: object
      required: [lon, lat, size_class, price_cents, vehicle_id]
      properties:
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
        size_class:
          type: string
        price_cents:
          type: integer
        address_hint:
          type: string
        notes:
          type: string
        vehicle_id:
          type: string
          format: uuid
          description: One of the caller's vehicles; required so claimers know which car to meet
        preferred_departure_at:
          type: string
          format: date-time
          nullable: true
        auto_cancel_no_show:
          type: boolean
          default: true

    UpdateSpotRequest:
      type: object
      description: |
        Partial edit of an available listing. Location, listing lifetime, and
        spot size_class are not editable.
      properties:
        price_cents:
          type: integer
        notes:
          type: string
        vehicle_id:
          type: string
          format: uuid
        preferred_departure_at:
          type: string
          format: date-time
          nullable: true
        auto_cancel_no_show:
          type: boolean

    SpotProperties:
      type: object
      required:
        - owner_id
        - owner_name
        - size_class
        - status
        - price_cents
        - listed_until
        - auto_cancel_no_show
        - exact_location
        - is_mine
        - vehicle
      properties:
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        owner_rating:
          type: number
          format: double
          nullable: true
        size_class:
          type: string
        status:
          type: string
        price_cents:
          type: integer
        address_hint:
          type: string
        notes:
          type: string
        preferred_departure_at:
          type: string
          format: date-time
          nullable: true
        listed_until:
          type: string
          format: date-time
        auto_cancel_no_show:
          type: boolean
        exact_location:
          type: boolean
        is_mine:
          type: boolean
        vehicle:
          $ref: "#/components/schemas/VehicleSummary"

    GeoJSONPoint:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          description: "[longitude, latitude]"

    SpotFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          $ref: "#/components/schemas/GeoJSONPoint"
        properties:
          $ref: "#/components/schemas/SpotProperties"

    SpotFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: "#/components/schemas/SpotFeature"

    CreateOfferRequest:
      type: object
      required: [vehicle_id, exchange_at, amount_cents]
      properties:
        vehicle_id:
          type: string
          format: uuid
        exchange_at:
          type: string
          format: date-time
        amount_cents:
          type: integer
          minimum: 0
          maximum: 2000

    OfferResponse:
      type: object
      required:
        - id
        - spot_id
        - driver_id
        - vehicle_id
        - exchange_at
        - amount_cents
        - status
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        spot_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        exchange_at:
          type: string
          format: date-time
        amount_cents:
          type: integer
        status:
          type: string
          enum: [pending, accepted, rejected, withdrawn, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ReservationResponse:
      type: object
      required:
        - id
        - spot_id
        - driver_id
        - owner_id
        - status
        - price_cents
        - exchange_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        spot_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        status:
          type: string
        price_cents:
          type: integer
        offer_id:
          type: string
          format: uuid
        driver_vehicle_id:
          type: string
          format: uuid
        exchange_at:
          type: string
          format: date-time
        owner_ready_at:
          type: string
          format: date-time
          nullable: true
        driver_arrived_at:
          type: string
          format: date-time
          nullable: true
        driver_ready_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    TicketResponse:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket:
          type: string
        expires_in:
          type: integer

    ViewportMessage:
      type: object
      required: [type, bbox]
      description: Client to server WebSocket message
      properties:
        type:
          type: string
          enum: [viewport]
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
          description: "[west, south, east, north]"
        zoom:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    SnapshotMessage:
      type: object
      required: [type, features]
      description: Server to client WebSocket snapshot after a viewport
      properties:
        type:
          type: string
          enum: [snapshot]
        features:
          type: array
          items:
            $ref: "#/components/schemas/SpotFeature"

    SpotEventMessage:
      type: object
      required: [type, id, lon, lat, exact_location]
      description: Server to client incremental event
      properties:
        type:
          type: string
          enum: [spot.added, spot.updated, spot.removed, reservation.updated]
        id:
          type: string
          format: uuid
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
        status:
          type: string
        price_cents:
          type: integer
        exact_location:
          type: boolean

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
