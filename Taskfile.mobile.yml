version: "3"

silent: true

vars:
  APP_DIR: apps/mobile

tasks:
  start:
    desc: Start the Metro bundler for the dev client
    interactive: true
    cmds:
      # Hoisted node_modules lives at the repo root; filter keeps the cwd of
      # Expo's resolution inside apps/mobile without a local node_modules/.bin.
      - pnpm --filter @parkxchange/mobile exec expo start --dev-client

  prebuild:
    desc: Generate the native android project from app.config.ts
    cmds:
      - pnpm --filter @parkxchange/mobile exec expo prebuild --platform android

  android:
    desc: Build and install the dev client on the connected device or emulator
    interactive: true
    cmds:
      # Gradle build-cache can restore a partial :expo compile that omits
      # ReactActivityDelegateWrapper.class; MainActivity then fails to resolve
      # it. Ensure a real local compile before expo run:android.
      #
      # On Windows, Task's shell must not run `./gradlew` (cmd sees a lone `.`).
      # android:compile-expo invokes gradlew.bat via cmd.exe instead.
      - task: android:ensure-expo-classes
      - pnpm --filter @parkxchange/mobile exec expo run:android

  android:ensure-expo-classes:
    desc: Recompile :expo when ReactActivityDelegateWrapper.class is missing
    internal: true
    status:
      - test -f node_modules/expo/android/build/tmp/kotlin-classes/debug/expo/modules/ReactActivityDelegateWrapper.class
    cmds:
      - echo "expo ReactActivityDelegateWrapper missing; recompiling :expo without build-cache"
      - rm -rf node_modules/expo/android/build
      - task: android:compile-expo

  android:compile-expo:
    internal: true
    dir: apps/mobile/android
    cmds:
      # Task's Windows shell cannot run `./gradlew` — cmd treats `./` as a lone
      # `.`. Drive the .bat wrapper through cmd.exe from the android dir instead.
      - cmd: cmd.exe /c gradlew.bat :expo:compileDebugKotlin --no-build-cache --rerun-tasks
        platforms: [windows]
      - cmd: ./gradlew :expo:compileDebugKotlin --no-build-cache --rerun-tasks
        platforms: [linux, darwin]

  clean:
    desc: Drop the generated native project, Metro cache, and stale :expo Kotlin outputs
    dir: "{{.APP_DIR}}"
    cmds:
      - rm -rf android .expo
      # node_modules is hoisted at the repo root; :expo builds there, not under apps/mobile.
      - rm -rf ../../node_modules/expo/android/build
      - echo "Removed generated native project and :expo build; run task mobile:prebuild to recreate it"

  devices:
    desc: List attached Android devices and running emulators
    cmds:
      - "$ANDROID_HOME/platform-tools/adb devices -l"

  emulator:
    desc: 'Boot an Android emulator, e.g. task mobile:emulator -- Pixel_9a'
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Available AVDs:"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          exit 0
        fi
        AVD="{{.CLI_ARGS}}"
        # Detach on Windows/Git Bash: bare `&` dies when task exits.
        if command -v cmd.exe >/dev/null 2>&1; then
          EMU="$ANDROID_HOME/emulator/emulator.exe"
          # Convert Git Bash path to Windows if needed.
          case "$EMU" in
            /*) EMU="$(cygpath -w "$EMU" 2>/dev/null || echo "$EMU")" ;;
          esac
          cmd.exe //c start "" "$EMU" -avd "$AVD"
          echo "Starting AVD $AVD (detached). Wait ~20s then: task mobile:devices"
        else
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD" >/tmp/parkxchange-emulator.log 2>&1 &
          echo "Starting AVD $AVD (pid $!). Log: /tmp/parkxchange-emulator.log"
        fi

  typecheck:
    desc: Typecheck the mobile app
    cmds:
      - pnpm --filter @parkxchange/mobile exec tsc --noEmit

  test:
    desc: Run mobile unit tests
    cmds:
      - pnpm --filter @parkxchange/mobile test
