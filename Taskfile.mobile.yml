version: "3"

silent: true

vars:
  APP_DIR: apps/mobile

tasks:
  start:
    desc: Start Metro (uses the last mobile:env:* target, or emulator defaults)
    interactive: true
    cmds:
      - task: expo:exec
        vars:
          EXPO_CMD: start --dev-client

  start:emulator:
    desc: Point the app at 10.0.2.2 and start Metro
    interactive: true
    cmds:
      - task: env:emulator
      - task: start

  start:device:
    desc: Point the app at this PC's Wi-Fi IP and start Metro
    interactive: true
    cmds:
      - task: env:device
      - task: start

  prebuild:
    desc: Generate the native android project from app.config.ts
    cmds:
      - pnpm --filter @parkxchange/mobile exec expo prebuild --platform android

  android:
    desc: "Build/install debug APK (defaults to emulator URLs — prefer android:emulator or android:device)"
    interactive: true
    cmds:
      - task: android:emulator

  android:emulator:
    desc: Build/install debug APK targeting the Android emulator (10.0.2.2)
    interactive: true
    cmds:
      - task: env:emulator
      - task: android:ensure-expo-classes
      - task: expo:exec
        vars:
          EXPO_CMD: run:android

  android:device:
    desc: Build/install debug APK targeting a USB/Wi-Fi phone (LAN IP of this PC)
    interactive: true
    cmds:
      - task: env:device
      - task: android:ensure-expo-classes
      - task: expo:exec
        vars:
          EXPO_CMD: run:android

  env:emulator:
    desc: Activate emulator API URLs (writes .env.development.local)
    cmds:
      - bash tools/mobile-use-env.sh emulator

  env:device:
    desc: "Activate physical-device API URLs; optional -- <ip> to set/override LAN IP"
    cmds:
      - bash tools/mobile-use-env.sh device {{.CLI_ARGS}}

  # Root Taskfile dotenv:[.env] used to inject EXPO_PUBLIC_* into every task;
  # Expo then ignores .env.development.local for those keys. Clear + re-source.
  expo:exec:
    internal: true
    interactive: true
    cmds:
      - |
        set -e
        unset EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL
        if [ -f "{{.APP_DIR}}/.env.development.local" ]; then
          set -a
          # shellcheck disable=SC1091
          . "{{.APP_DIR}}/.env.development.local"
          set +a
        fi
        echo "expo will use API ${EXPO_PUBLIC_API_URL:-'(from apps/mobile env files)'}"
        pnpm --filter @parkxchange/mobile exec expo {{.EXPO_CMD}}

  android:ensure-expo-classes:
    desc: Recompile :expo when ReactActivityDelegateWrapper.class is missing
    internal: true
    status:
      - test -f node_modules/expo/android/build/tmp/kotlin-classes/debug/expo/modules/ReactActivityDelegateWrapper.class
    cmds:
      - echo "expo ReactActivityDelegateWrapper missing; recompiling :expo without build-cache"
      - rm -rf node_modules/expo/android/build
      - task: android:compile-expo

  android:compile-expo:
    internal: true
    dir: apps/mobile/android
    cmds:
      # Task's Windows shell cannot run `./gradlew` — cmd treats `./` as a lone
      # `.`. Drive the .bat wrapper through cmd.exe from the android dir instead.
      - cmd: cmd.exe /c gradlew.bat :expo:compileDebugKotlin --no-build-cache --rerun-tasks
        platforms: [windows]
      - cmd: ./gradlew :expo:compileDebugKotlin --no-build-cache --rerun-tasks
        platforms: [linux, darwin]

  clean:
    desc: Drop the generated native project, Metro cache, and stale :expo Kotlin outputs
    dir: "{{.APP_DIR}}"
    cmds:
      - rm -rf android .expo .env.development.local
      # node_modules is hoisted at the repo root; :expo builds there, not under apps/mobile.
      - rm -rf ../../node_modules/expo/android/build
      - echo "Removed generated native project and :expo build; run task mobile:prebuild to recreate it"

  devices:
    desc: List attached Android devices and running emulators
    cmds:
      - "$ANDROID_HOME/platform-tools/adb devices -l"

  emulator:
    desc: 'Boot an Android emulator, e.g. task mobile:emulator -- Pixel_9a'
    cmds:
      - |
        set -e
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Available AVDs:"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          exit 0
        fi
        AVD="{{.CLI_ARGS}}"
        EMU_BIN="$ANDROID_HOME/emulator/emulator"
        if [ -f "$ANDROID_HOME/emulator/emulator.exe" ]; then
          EMU_BIN="$ANDROID_HOME/emulator/emulator.exe"
        fi
        if ! "$EMU_BIN" -list-avds | grep -Fxq "$AVD"; then
          echo "Unknown AVD: $AVD"
          echo "Available:"
          "$EMU_BIN" -list-avds
          exit 1
        fi
        # Prefer a real Windows path for logs; /tmp under Git Bash often vanishes.
        if [ -n "${LOCALAPPDATA:-}" ]; then
          LOG="$LOCALAPPDATA/parkxchange-emulator.log"
        else
          LOG="${TMPDIR:-/tmp}/parkxchange-emulator.log"
        fi
        case "$(uname -s 2>/dev/null || echo unknown)" in
          MINGW*|MSYS*|CYGWIN*)
            # nohup does not keep Win32 emulator.exe alive after Task's shell
            # exits. Detach with cmd start from the emulator directory.
            EMU_DIR="$ANDROID_HOME/emulator"
            if command -v cygpath >/dev/null 2>&1; then
              EMU_DIR="$(cygpath -w "$EMU_DIR")"
            fi
            cmd.exe /c "start \"px-$AVD\" /D \"$EMU_DIR\" emulator.exe -avd $AVD" \
              >"$LOG" 2>&1 || true
            ;;
          *)
            nohup "$EMU_BIN" -avd "$AVD" >"$LOG" 2>&1 &
            echo "pid $!"
            ;;
        esac
        echo "Starting AVD $AVD"
        echo "Log: $LOG"
        echo "Wait ~30s (until boot finishes), then: task mobile:devices"

  typecheck:
    desc: Typecheck the mobile app
    cmds:
      - pnpm --filter @parkxchange/mobile exec tsc --noEmit

  test:
    desc: Run mobile unit tests
    cmds:
      - pnpm --filter @parkxchange/mobile test
